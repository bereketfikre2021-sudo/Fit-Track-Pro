name: Deploy GitHub Pages

on:
  push:
    branches: [main, master]
    paths-ignore:
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build for GitHub Pages
        run: npx vite build
        env:
          GITHUB_PAGES: 'true'

          # ── Gemini (public) ────────────────────────────────────────
          VITE_GEMINI_MODEL: gemini-3.5-flash

          # ── Supabase (URL is public; anon key from secret) ─────────
          VITE_SUPABASE_URL: https://myyttidixinlbohlfftd.supabase.co
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

          # ── Firebase (all public identifiers) ──────────────────────
          VITE_FIREBASE_API_KEY: AIzaSyBiYgxLlmqAjBWmmtRxbT9kEkNuPMm8Smc
          VITE_FIREBASE_AUTH_DOMAIN: fit-track-pro-d4e6f.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: fit-track-pro-d4e6f
          VITE_FIREBASE_STORAGE_BUCKET: fit-track-pro-d4e6f.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: '384275195217'
          VITE_FIREBASE_APP_ID: 1:384275195217:web:743b5c3eae90068e6d1f70
          VITE_FIREBASE_VAPID_KEY: BL6VYgZiAsGbqIJMoCb_w8ioqO0AysePdyfc5hAL3RRw6j7Ye1ONWBj7h4_bDNAULLtoKQYJdOsk8wMVTnb6mko

          # ── AdMob (test IDs until production IDs are ready) ────────
          VITE_ADMOB_DISABLED: 'false'
          VITE_ADMOB_FORCE_TEST_ADS: 'false'

      - name: Publish build to docs/
        run: |
          rm -rf docs
          mkdir -p docs
          cp -r dist/. docs/
          touch docs/.nojekyll

      - name: Commit and push docs/
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --staged --quiet; then
            echo "No changes to deploy"
            exit 0
          fi
          git commit -m "Deploy GitHub Pages [skip ci]"
          git push
