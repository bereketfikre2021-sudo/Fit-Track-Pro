name: Deploy GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

# Required for the official Pages deployment action
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; cancel in-progress if a new push arrives
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build
        run: npx vite build
        env:
          VITE_GEMINI_MODEL: gemini-1.5-flash

          VITE_SUPABASE_URL: https://myyttidixinlbohlfftd.supabase.co
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

          VITE_FIREBASE_API_KEY: AIzaSyBiYgxLlmqAjBWmmtRxbT9kEkNuPMm8Smc
          VITE_FIREBASE_AUTH_DOMAIN: fit-track-pro-d4e6f.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: fit-track-pro-d4e6f
          VITE_FIREBASE_STORAGE_BUCKET: fit-track-pro-d4e6f.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: '384275195217'
          VITE_FIREBASE_APP_ID: 1:384275195217:web:743b5c3eae90068e6d1f70
          VITE_FIREBASE_VAPID_KEY: BL6VYgZiAsGbqIJMoCb_w8ioqO0AysePdyfc5hAL3RRw6j7Ye1ONWBj7h4_bDNAULLtoKQYJdOsk8wMVTnb6mko

          VITE_ADMOB_DISABLED: 'false'
          VITE_ADMOB_FORCE_TEST_ADS: 'false'

      # Upload the dist/ folder as a Pages artifact (no git commit needed)
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      # Deploy the artifact to GitHub Pages (writes to the gh-pages environment,
      # never commits anything back to master)
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
